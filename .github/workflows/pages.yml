# Optional static catalog — GitHub Pages only (no server you maintain).
#
# One-time setup (required or the job fails / serves the wrong tree):
#   1. Settings → Pages → Build and deployment → Source = GitHub Actions
#      (not "Deploy from a branch" — that publishes repo root, not the Next export)
#   2. Settings → Environments → github-pages → Deployment branches and tags
#      → "No restriction" (or allow `main` plus tags `*.*.*` / `v*`)
#      Tag-only deploys fail with: Tag "x.y.z" is not allowed to deploy…
name: Deploy design catalog to GitHub Pages

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
